[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "aereo-geospatial-api"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.143,<0.144",
  "uvicorn>=0.54,<0.55",
  "python-multipart>=0.0.32,<0.1",
  "SQLAlchemy>=2.1.4,<2.2",
  "geopandas>=1.2,<1.3",
  "shapely>=2.2,<2.3",
  "pyproj>=3.7,<3.8",
  "Fiona>=1.10,<1.11",
  "defusedxml>=0.7,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<9.2", "httpx>=0.28,<0.29", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
